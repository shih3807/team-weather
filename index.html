<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>要帶傘嗎</title>
    <!-- 設定 icon -->
    <link rel="icon" href="./image/icon.png" />
    <!-- 引入字型 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Noto+Sans+TC:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <!-- 建立整體樣式指導：基礎字型、字體、基底色、標題、段落樣式等等 -->
    <link rel="stylesheet" type="text/css" href="css/common.css" />
    <!-- 建立雨量觀測部份的樣式 -->
    <link rel="stylesheet" type="text/css" href="css/current-weather.css" />
    <link rel="stylesheet" type="text/css" href="css/daily-rainfall.css" />
    <link rel="stylesheet" type="text/css" href="css/regional-overview.css" />
  </head>

  <body>
    <header>
      <div class="header_info">
        <div class="header_info_title">
          <div class="header_info_title_icon">
            <img src="./image/header/header_icon.png" />
          </div>
          <div class="header_info_title_text">
            <div class="header_info_title_text_cn">要帶傘嗎</div>
            <div class="header_info_title_text_en">Umbrella Today</div>
          </div>
        </div>
        <div class="header_info_time">
          <div class="header_info_time_date">2026 年 1 月 26 日 星期一</div>
          <div class="header_info_time_update">
            <div class="header_info_time_update_icon">
              <img src="./image/header/header_clock.png" />
            </div>
            <div class="header_info_time_update_time">最後更新 上午 11：25</div>
          </div>
        </div>
      </div>
    </header>
    <section class="current-weather">
      <div class="current-weather_local">
        <div class="current-weather_local_container">
          <div class="current-weather_local_container_text">
            <div class="current-weather_local_container_text_location">
              <div class="current-weather_local_container_text_location_icon">
                <img src="./image/local-weather/location.png" />
              </div>
              <div class="current-weather_local_container_text_location_text">
                臺北市
              </div>
            </div>

            <div class="current-weather_local_container_text_temperature">
              <div
                class="current-weather_local_container_text_temperature_current"
              >
                24°C
              </div>
              <div
                class="current-weather_local_container_text_temperature_weather"
              >
                多雲時晴
              </div>
              <div
                class="current-weather_local_container_text_temperature_feeling"
              >
                體感溫度 26°C
              </div>
            </div>

            <div class="current-weather_local_container_text_other">
              <div class="current-weather_local_container_text_other_wind">
                <div
                  class="current-weather_local_container_text_other_wind_icon"
                >
                  <img src="./image/local-weather/wind.png" />
                </div>
                <div
                  class="current-weather_local_container_text_other_wind_text"
                >
                  <div
                    class="current-weather_local_container_text_other_wind_text_title"
                  >
                    風速
                  </div>
                  <div
                    class="current-weather_local_container_text_other_wind_text_value"
                  >
                    12 km/h
                  </div>
                </div>
              </div>
              <div class="current-weather_local_container_text_other_humidity">
                <div
                  class="current-weather_local_container_text_other_humidity_icon"
                >
                  <img src="./image/local-weather/humidity.png" />
                </div>
                <div
                  class="current-weather_local_container_text_other_humidity_text"
                >
                  <div
                    class="current-weather_local_container_text_other_humidity_text_title"
                  >
                    濕度
                  </div>
                  <div
                    class="current-weather_local_container_text_other_humidity_text_value"
                  >
                    65%
                  </div>
                </div>
              </div>
              <div
                class="current-weather_local_container_text_other_visibility"
              >
                <div
                  class="current-weather_local_container_text_other_visibility_icon"
                >
                  <img src="./image/local-weather/visibility.png" />
                </div>
                <div
                  class="current-weather_local_container_text_other_visibility_text"
                >
                  <div
                    class="current-weather_local_container_text_other_visibility_text_title"
                  >
                    能見度
                  </div>
                  <div
                    class="current-weather_local_container_text_other_visibility_text_value"
                  >
                    10 km
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="current-weather_national">
        <div class="current-weather_national_container">
          <div class="current-weather_national_container_ave"></div>
          <div class="current-weather_national_container_max"></div>
          <div class="current-weather_national_container_min"></div>
          <div class="current-weather_national_container"></div>
        </div>
      </div>
    </section>
    <section class="daily-rainfall">
      <!-- 美化雨量觀測顯示、資料處理或建立資料分頁功能 -->
      <div class="rain-header">
        <h3>雨量監測</h3>
        <!-- <button id="toggleview">切換圖表</button>-->
      </div>
      <!-- 雨量監測 -->
      <div id="raining" class="rain-content">
        <!-- 左:長條圖 -->
        <div class="rain-chart">
          <h3>各縣市雨量分布圖</h3>
          <canvas id="rainBarchart"></canvas>

          <div class="base">
            <span class="low">&lt; 20 mm</span>
            <span class="mid">20 ~ 40 mm</span>
            <span class="high">&gt; 40 mm</span>
          </div>
        </div>

        <!-- 右:數據統計 -->
        <div class="rain-status">
          <!-- 頁面切換 -->
          <div class="table-header">
            <h3>雨量統計</h3>
            <div class="pagination">
              <button id="prevpage">◀</button>
              <span id="pageinfo"> 1 / 2</span>
              <button id="nextpage">▶</button>
            </div>
          </div>

          <!-- 表格 -->
          <div class="rain-table">
            <table>
              <thead>
                <tr>
                  <th>地區</th>
                  <th>最高雨量 (mm)</th>
                  <th>最低雨量 (mm)</th>
                </tr>
              </thead>
              <tbody id="raintablebody">
                <!-- JS動態產生 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </section>

    <div class="section-divider"></div>

    <!--
			完成各縣市氣象預報功能
			請使用中央氣象局公開 API 的第一個資料集 (/v1/rest/datastore/F-C0032-001)
			https://opendata.cwa.gov.tw/dist/opendata-swagger.html
		-->
    <section class="regional-overview">
      <h3>一周預報</h3>
      <div class="table-wrapper">
        <table class="weather-table"></table>
      </div>

      <div id="weather"></div>
    </section>
    <footer></footer>

    <script src="js/main.js"></script>
    <!-- 把KEY存放在config中 -->
    <script src="js/config.js"></script>
    <script src="js/current-weather.js"></script>
    <!-- for chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/daily-rainfall.js"></script>
    <script src="js/regional-overview.js"></script>
  </body>
</html>
